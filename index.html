<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHILOCOURS IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root{
--blue:#0D1B2A;
--gold:#D4AF37;
--white:#ffffff;
--danger:#dc2626;
}

body{
margin:0;
font-family:Inter,sans-serif;
background:linear-gradient(135deg,#0D1B2A,#1B263B);
color:white;
min-height:100vh;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

h1,h2{
font-family:'Playfair Display',serif;
}

.card{
background:rgba(255,255,255,.08);
padding:25px;
border-radius:15px;
margin-top:20px;
backdrop-filter:blur(10px);
}

label{
display:block;
margin-bottom:15px;
}

input,select{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:5px;
}

button{
background:var(--gold);
border:none;
padding:12px 25px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.error-box{
background:#7f1d1d;
border:1px solid #ef4444;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.success{
background:#14532d;
padding:15px;
border-radius:10px;
margin-top:20px;
}

.ticket{
font-size:28px;
font-weight:bold;
color:var(--gold);
}

.hidden{
display:none;
}

.membership-card{
background:white;
color:black;
border-radius:15px;
padding:20px;
margin-top:20px;
max-width:350px;
}

.photo-preview{
width:100px;
height:120px;
background:#e5e7eb;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:8px;
}

.photo-preview img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>

<div class="container">

<h1>PHILOCOURS IA</h1>

<p>
La philosophie intelligente au service de votre réussite
</p>

<div class="card">

<h2>Inscription</h2>

<div id="errors"></div>

<label>
Nom
<input type="text" id="nom">
</label>

<label>
Prénom
<input type="text" id="prenom">
</label>

<label>
Email
<input type="email" id="email">
</label>

<label>
Téléphone
<input type="text" id="telephone">
</label>

<label>
Classe
<select id="classe">
<option>Premiere</option>
<option>Terminale</option>
</select>
</label>

<label>
Photo d'identité
<input type="file" id="photo" accept="image/*">
</label>

<label>
Référence de paiement
<input type="text" id="reference" placeholder="PHILOCOURS">
</label>

<label>
Numéro de transaction MVola
<input type="text" id="transaction">
</label>

<div class="card">
<p><strong>Adhésion :</strong> 10 000 Ar / mois</p>
<p>MVola : +261385528349</p>
<p>Bénéficiaire : Nasandratriniaina Julio</p>
<p>Référence obligatoire : PHILOCOURS</p>
</div>

<br>

<button onclick="validerInscription()">
Valider mon inscription
</button>

<div id="success"></div>

</div>

<div id="carte" class="membership-card hidden">

<h3>PHILOCOURS IA</h3>

<div class="photo-preview" id="photoZone">
PHOTO
</div>

<br>

<p><strong id="carteNom"></strong></p>

<p>
Classe :
<span id="carteClasse"></span>
</p>

<p>
Ticket :
</p>

<div class="ticket" id="ticket"></div>

<br>

<p>
Valable 30 jours
</p>

</div>

</div>

<script>

function genererTicket(classe){

if(classe==="Premiere"){
return "PH-P-" +
Math.floor(
100000 + Math.random()*900000
);
}

return "PH-T-" +
Math.floor(
10000000 + Math.random()*90000000
);
}

function validerInscription(){

const erreurs=[];

const nom=document.getElementById("nom").value.trim();
const prenom=document.getElementById("prenom").value.trim();
const email=document.getElementById("email").value.trim();
const telephone=document.getElementById("telephone").value.trim();
const classe=document.getElementById("classe").value;
const reference=document.getElementById("reference").value.trim();
const transaction=document.getElementById("transaction").value.trim();

document.getElementById("errors").innerHTML="";
document.getElementById("success").innerHTML="";

if(nom===""){
erreurs.push("Le nom est obligatoire.");
}

if(prenom===""){
erreurs.push("Le prénom est obligatoire.");
}

const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailRegex.test(email)){
erreurs.push("Adresse e-mail invalide.");
}

if(telephone.length<10){
erreurs.push("Numéro de téléphone invalide.");
}

if(reference.toUpperCase()!=="PHILOCOURS"){
erreurs.push("La référence doit être PHILOCOURS.");
}

if(transaction.length<8){
erreurs.push("Numéro de transaction invalide.");
}

if(erreurs.length>0){

document.getElementById("errors").innerHTML=
'<div class="error-box">'+
erreurs.join("<br>")+
'</div>';

return;
}

const ticket=genererTicket(classe);

document.getElementById("ticket").textContent=ticket;
document.getElementById("carteNom").textContent=
nom + " " + prenom;

document.getElementById("carteClasse").textContent=
classe;

const photoInput=document.getElementById("photo");

if(photoInput.files.length>0){

const reader=new FileReader();

reader.onload=function(e){

document.getElementById("photoZone").innerHTML=
'<img src="'+e.target.result+'">';

};

reader.readAsDataURL(photoInput.files[0]);

}

document.getElementById("carte")
.classList.remove("hidden");

document.getElementById("success").innerHTML=
'<div class="success">✅ Inscription validée. Ticket généré : <strong>'+ticket+'</strong></div>';

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}
</script>

</body>
</html>
